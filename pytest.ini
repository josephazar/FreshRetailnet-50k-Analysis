[pytest]
# Project tests live only in `tests/`. Third-party vendored code under
# `freshretailnet_repos/` has its own test suites that require a different
# environment (lightning, pytorch-lightning v1.9) and is not part of this
# project's CI.
testpaths = tests
# Belt-and-suspenders: even if someone runs `pytest <path>` from elsewhere,
# do not descend into these directories.
norecursedirs =
    freshretailnet_repos
    experiments
    venv
    .venv
    .git
    output
    output/benchmark
    output_test
    notebook_output
    catboost_info
addopts =
    -q
    --strict-markers
